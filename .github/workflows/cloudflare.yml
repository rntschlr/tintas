name: Cloudflare Pages

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit dependencies including build tooling
        run: npm audit --audit-level=moderate
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build for Cloudflare
        env:
          NITRO_PRESET: cloudflare-pages
          VITE_AUTH_ENABLED: "false"
          VITE_PUBLIC_STANDALONE: "true"
          VITE_SHIP_GROK_CHROME: "false"
          VITE_PUBLIC_SITE_URL: ${{ vars.VITE_PUBLIC_SITE_URL || 'https://tintas.app' }}
        run: npm run build:cf
      - name: Verify production server
        env:
          VITE_PUBLIC_SITE_URL: ${{ vars.VITE_PUBLIC_SITE_URL || 'https://tintas.app' }}
        run: npm run test:production
      - name: Install browser for smoke tests
        run: npx playwright install --with-deps chromium
      - name: Verify browser interactions
        run: npm run test:browser
      - name: Check deployment configuration
        id: deployment
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy
        if: steps.deployment.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=tinta
      - name: Secrets missing
        if: steps.deployment.outputs.configured == 'false'
        run: |
          echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as Actions secrets, then re-run this workflow."
          echo "Pages project is tinta. Deployment did not occur."
          exit 1
