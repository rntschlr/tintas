name: Temporary clean lockfile after scaffold removal
on:
  push:
    branches:
      - maintenance/security-dependency-refresh-2026-11-20
    paths:
      - .github/workflows/temporary-simplify-lockfile.yml
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'rntschlr/tintas'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - name: Push lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: prune unused dependencies from lockfile"
            git push origin HEAD:maintenance/security-dependency-refresh-2026-11-20
          fi
